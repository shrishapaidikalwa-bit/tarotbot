name: Hourly publisher
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency: tarot-bot
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/publish.py
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "tarot-bot"
          git config user.email "tarot-bot@users.noreply.github.com"
          git add -A queue.json media
          git diff --cached --quiet || (git commit -m "Update queue" && git pull --rebase && git push)
