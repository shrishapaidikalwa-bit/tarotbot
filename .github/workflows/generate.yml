name: Weekly content generation
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:
concurrency: tarot-bot
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate next 7 days
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/generate.py
      - name: Commit queue and media
        if: always()
        run: |
          git config user.name "tarot-bot"
          git config user.email "tarot-bot@users.noreply.github.com"
          git add -A queue.json media
          git diff --cached --quiet || (git commit -m "Weekly content" && git pull --rebase && git push)
